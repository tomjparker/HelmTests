apiVersion: v1
kind: Pod
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus  # Used by service selector
spec:
  containers:
    - name: prometheus
      image: prom/prometheus:latest
      args:
        - "--config.file=/etc/prometheus/prometheus.yml" # Path of mounted config
      ports:
        - containerPort: 9090  # web ui and api port
      volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus # mounts the config from configmap
  volumes:
    - name: prometheus-config
      configMap:
        name: prometheus-config # Explicit Reference association to volume earlier declared
