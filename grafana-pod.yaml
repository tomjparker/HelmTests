apiVersion: v1
kind: Pod
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana                   # Label for service targeting
spec:
  containers:
    - name: grafana
      image: grafana/grafana:latest  # Grafana container image
      ports:
        - containerPort: 3000        # Default Grafana web port
      env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin               # Default admin username
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin               # Default password (fine for local testing)
